name: assembly
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.14
  - numpy=1.26.4
  - scipy=1.13.1
  - scikit-learn=1.5.2
  - pandas=2.2.3
  - matplotlib=3.9.3
  - pillow=10.4.0
  - pyyaml=6.0.2
  - tqdm=4.67.1
  - einops=0.8.0
  - trimesh=4.5.3
  - networkx=2.8.8
  - easydict=1.13
  - tabulate=0.9.0
  - pip
  - pip:
    # -----------------------------------------------------------
    # PyTorch ecosystem (CUDA 12.8 for RTX 5090 / sm_120)
    # MUST install via: pip install torch==2.7.0 torchvision==0.22.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cu128
    # The lines below are placeholders; run setup_5090_env.sh instead
    # -----------------------------------------------------------
    - torch==2.7.0
    - torchvision==0.22.0
    - torchaudio==2.7.0
    # -----------------------------------------------------------
    # PyG ecosystem
    # MUST install via: pip install torch_geometric pyg_lib torch_scatter torch_sparse torch_cluster torch_spline_conv -f https://data.pyg.org/whl/torch-2.7.0+cu128.html
    # -----------------------------------------------------------
    - torch_geometric==2.7.0
    # -----------------------------------------------------------
    # PyTorch Lightning 2.5 (last version with Python 3.9 support; safe for 3.10)
    # -----------------------------------------------------------
    - pytorch-lightning==2.5.0
    - torchmetrics==1.6.0
    - lightning-utilities==0.11.9
    # -----------------------------------------------------------
    # Other ML / 3D libraries
    # -----------------------------------------------------------
    - open3d==0.19.0
    - gtsam==4.2
    - plyfile==0.7.4
    - yacs==0.1.8
    - addict==2.4.0
    - fsspec>=2023.1.0
    - filelock>=3.10.0
    - packaging>=23.0
    - contourpy>=1.0.7
    - cycler>=0.11.0
    - fonttools>=4.38.0
    - kiwisolver>=1.4.4
    - pytz>=2022.7.1
