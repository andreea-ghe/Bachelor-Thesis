MODEL_NAME: jigsaw_train_everyday_double_attn_layers
MODULE: experiments

PROJECT: jigsaw

DATASET: breaking_bad.all_piece_matching

# Adjust GPUS and BATCH_SIZE to your hardware
# With 1 GPU: BATCH_SIZE 4 should work (model is ~25MB)
# If you get OOM, try BATCH_SIZE 2
GPUS: [0]
BATCH_SIZE: 4
FP16: false
NUM_WORKERS: 8

TRAIN:
  NUM_EPOCHS: 250        # fine-tuning needs fewer epochs than training from scratch
  LR: 0.001             # 10x lower than training from scratch (0.001)
  PAIR_LR_MULT: 1.0      # same LR for all layers since new layers are cloned from pretrained
  WEIGHT_DECAY: 0.
  WARMUP_RATIO: 0.
  LR_SCHEDULER: 'cosine'
  LR_DECAY: 100.
  VAL_EVERY: 5

CALLBACK:
  CHECKPOINT_MONITOR: val/mat_f1
  CHECKPOINT_MODE: max

DATA:
  DATA_DIR: /workspace/everyday_all_2
  SUBSET: everyday
  DATA_FN: 'everyday.{}.txt'
  MAX_NUM_PART: 20
  NUM_PC_POINTS: 5000
  SAMPLE_BY: area
  MIN_PART_POINT: 30
  FRACTURE_LABEL_THRESHOLD: 0.025

MODEL:
  PC_CLS_METHOD: multi
  LOSS:
    w_cls_loss: 1.0
    w_mat_loss: 0.0
    mat_epoch: 9
    w_rig_loss: 0.0
    rig_epoch: 199

STATS: "./results/jigsaw_train_everyday_double_attn_layers/stats/eval"
