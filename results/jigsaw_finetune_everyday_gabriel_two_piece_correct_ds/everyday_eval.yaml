MODEL_NAME: jigsaw_finetune_everyday_gabriel_two_piece_correct_ds
MODULE: experiments

PROJECT: jigsaw

DATASET: breaking_bad.all_piece_matching

GPUS: [0]
BATCH_SIZE: 1
NUM_WORKERS: 16

TRAIN:
  NUM_EPOCHS: 200
  LR: 0.001
  WEIGHT_DECAY: 0.
  WARMUP_RATIO: 0.
  LR_SCHEDULER: 'cosine'
  LR_DECAY: 100.
  VAL_EVERY: 5

CALLBACK:
  CHECKPOINT_MONITOR: val/loss
  CHECKPOINT_MODE: min

DATA:
  DATA_DIR: /workspace/everyday
  SUBSET: everyday
  DATA_FN: 'everyday.{}.txt'
  MAX_NUM_PART: 2
  NUM_PC_POINTS: 5000
  SAMPLE_BY: area
  MIN_PART_POINT: 30
  TEST_LENGTH: 1000
  FRACTURE_LABEL_THRESHOLD: 0.025

MODEL:
  USE_GABRIEL: true
  PC_CLS_METHOD: multi

STATS: "./results/jigsaw_finetune_everyday_gabriel_two_piece_correct_ds/stats/eval"

WEIGHT_FILE: results/jigsaw_finetune_everyday_gabriel_two_piece_correct_ds/model_save/modelepoch=079.ckpt