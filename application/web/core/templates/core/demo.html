<div id="demo-panel" class="border border-brd-soft rounded-xl flex-1 flex flex-col overflow-hidden">

    <div class="flex items-center justify-between px-5 py-3 border-b border-brd-soft">
        <span class="text-xs text-txt-muted">Interactive Demo</span>
        <button onclick="openFullscreen()" class="btn text-xs">Expand Demo</button>
    </div>

    <div id="compact-controls" class="px-5 py-4 space-y-3 border-b border-brd-soft">
        <div class="flex gap-3">
            <div class="flex-1">
                <label class="text-xs text-txt-muted block mb-1.5">Model</label>
                <select id="model-select" class="select">
                    {% for value, label in model_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex-1">
                <label class="text-xs text-txt-muted block mb-1.5">Category</label>
                <select id="category-select" class="select">
                    <option value="all">All</option>
                </select>
            </div>
        </div>

        <div class="flex items-center justify-between">
            <span class="text-xs text-txt-muted">Example</span>
            <div class="flex items-center gap-2">
                <button id="prev-btn" class="btn-icon" disabled>
                    {% include "components/icons/first_page.html" %}
                </button>
                <span id="example-counter"
                      class="text-xs text-txt-secondary tabular-nums min-w-[3rem] text-center">—</span>
                <button id="next-btn" class="btn-icon" disabled>
                    {% include "components/icons/last_page.html" %}
                </button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col min-h-0 px-5 py-3 gap-2">
        <p class="text-[10px] text-txt-muted text-center uppercase tracking-wider">Input</p>
        <div class="flex-1 min-h-0">
            <div class="viewer-box w-full h-full" id="viewer-canvas">
                <div id="viewer-placeholder"
                     class="absolute inset-0 flex items-center justify-center text-txt-muted text-xs pointer-events-none">
                    Select an example above
                </div>
            </div>
        </div>

        <div class="py-1 shrink-0">
            <button id="run-btn" class="btn w-full" disabled>Fix Object</button>
            <div id="status" class="text-xs text-txt-muted mt-1 min-h-[1rem]"></div>
        </div>

        <p class="text-[10px] text-txt-muted text-center uppercase tracking-wider">Output</p>
        <div class="flex-1 min-h-0">
            <div class="viewer-box w-full h-full" id="result-canvas">
                <div id="result-placeholder"
                     class="absolute inset-0 flex items-center justify-center text-txt-muted text-xs pointer-events-none">
                    Assembled result appears here
                </div>
            </div>
        </div>
    </div>
</div>

<div id="fullscreen-overlay" class="fullscreen-overlay">
    <div class="flex h-full">

        <div id="fs-left-panel" class="w-1/2 flex flex-col h-full p-6">
            <div class="flex items-center justify-between mb-4">
                <button onclick="closeFullscreen()" class="btn text-xs">
                    {% include "components/icons/close_full_screen.html" %}
                    <span>Show Guide</span>
                </button>
                <select id="fs-model-select" class="select w-auto">
                    {% for value, label in model_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div id="fs-browse-viewer" class="flex-1 flex flex-col">
                <div class="flex-1 viewer-box" id="fs-viewer-canvas">
                    <div id="fs-viewer-placeholder"
                         class="absolute inset-0 flex items-center justify-center text-txt-muted text-sm pointer-events-none">
                        Pick an example from the grid
                    </div>
                </div>
            </div>

            <div id="fs-compare-viewers" class="flex-1 flex flex-col gap-3 hidden">
                <div class="flex-1 flex flex-col space-y-1">
                    <span id="cmp-label-a" class="text-xs text-txt-muted block text-center">Model A</span>
                    <div class="viewer-box flex-1" id="cmp-viewer-a">
                        <div id="cmp-placeholder-a"
                             class="absolute inset-0 flex items-center justify-center text-txt-muted text-xs pointer-events-none">
                            Result A
                        </div>
                    </div>
                </div>
                <div class="flex-1 flex flex-col space-y-1">
                    <span id="cmp-label-b" class="text-xs text-txt-muted block text-center">Model B</span>
                    <div class="viewer-box flex-1" id="cmp-viewer-b">
                        <div id="cmp-placeholder-b"
                             class="absolute inset-0 flex items-center justify-center text-txt-muted text-xs pointer-events-none">
                            Result B
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4 mt-4">
                <button id="fs-run-btn" class="btn" disabled>Fix Object</button>
                <div id="fs-status" class="text-xs text-txt-muted flex-1"></div>
                <div class="flex items-center gap-2">
                    <button id="fs-prev-btn" class="btn-icon" disabled>
                        {% include "components/icons/first_page.html" %}
                    </button>
                    <span id="fs-example-counter"
                          class="text-xs text-txt-secondary tabular-nums min-w-[3rem] text-center">—</span>
                    <button id="fs-next-btn" class="btn-icon" disabled>
                        {% include "components/icons/last_page.html" %}
                    </button>
                </div>
            </div>
        </div>

        <div id="fs-right-panel" class="w-1/2 flex flex-col h-full p-6 pl-0">

            <div class="flex gap-2 mb-4">
                <button class="btn active" data-tab="browse">Browse Examples</button>
                <button class="btn" data-tab="compare">Compare Performance</button>
            </div>

            <div id="tab-browse" class="fs-tab-content active flex-1 overflow-y-auto pr-2">
                <p class="text-txt-secondary text-sm mb-4">
                    Pick a fracture from the grid to load it into the viewer.
                </p>
                <div id="fs-examples-grid" class="grid grid-cols-3 gap-3"></div>
            </div>

            <div id="tab-compare" class="fs-tab-content flex-1 overflow-y-auto pr-2 hidden">
                <p class="text-txt-secondary text-sm mb-4">
                    Pick an example from the grid, then compare two models side by side.
                </p>

                <div class="flex gap-3 mb-4">
                    <div class="flex-1">
                        <label class="text-xs text-txt-muted block mb-1.5">Model A</label>
                        <select id="cmp-model-a" class="select">
                            {% for value, label in model_choices %}
                            <option value="{{ value }}"{% if forloop.first %} selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-txt-muted block mb-1.5">Model B</label>
                        <select id="cmp-model-b" class="select">
                            {% for value, label in model_choices %}
                            <option value="{{ value }}"{% if forloop.counter == 5 %} selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div id="cmp-status" class="text-xs text-txt-muted mb-4 min-h-[1rem]"></div>

                <div id="cmp-examples-grid" class="grid grid-cols-3 gap-3"></div>
            </div>
        </div>
    </div>
</div>
