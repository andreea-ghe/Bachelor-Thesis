{% load static %}
<section id="slide-presentation" class="flex flex-col h-full">
    <div class="flex items-center justify-between px-6 py-4">
        <div class="flex items-center gap-3">
            <button id="slide-prev" class="btn-icon" disabled>
                {% include "components/icons/arrow_narrow_up.html" %}
            </button>
            <span id="slide-counter" class="text-xs text-txt-muted tabular-nums">1 / 13</span>
            <button id="slide-next" class="btn-icon">
                {% include "components/icons/arrow_narrow_down.html" %}
            </button>
        </div>
    </div>

    <div id="slide-container" class="flex-1 flex items-start justify-center px-6 pb-6 overflow-y-auto">
        <img id="slide-image"
             src="{% static 'core/images/presentation/Slide2.PNG' %}"
             alt="Presentation slide"
             class="w-full rounded-lg shadow-lg"
             style="max-width: 100%; height: auto;">
    </div>

    <script>
    (function() {
        const TOTAL_SLIDES = 14;
        let current = 2;

        const img = document.getElementById('slide-image');
        const counter = document.getElementById('slide-counter');
        const prevBtn = document.getElementById('slide-prev');
        const nextBtn = document.getElementById('slide-next');
        const STATIC = '{% get_static_prefix %}';

        function update() {
            img.src = STATIC + 'core/images/presentation/Slide' + current + '.PNG';
            counter.textContent = (current - 1) + ' / ' + (TOTAL_SLIDES - 1);
            prevBtn.disabled = current === 2;
            nextBtn.disabled = current === TOTAL_SLIDES;
        }

        prevBtn.addEventListener('click', function() {
            if (current > 2) { current--; update(); }
        });
        nextBtn.addEventListener('click', function() {
            if (current < TOTAL_SLIDES) { current++; update(); }
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                if (current > 2) { current--; update(); }
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                if (current < TOTAL_SLIDES) { current++; update(); }
            }
        });
    })();
    </script>
</section>
